<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INF181 — Statement PDF Editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<div id="app">

  <header>
    <div class="brand">INF181 <span>Statement PDF Editor</span></div>
    <div class="tag">development build — templates built in</div>
    <div class="spacer"></div>
    <div id="doc-name"></div>
    <div id="counts"></div>
    <!-- Shown only inside the Policy Generator's overlay, which has no title
         bar of its own: closes (hides) the overlay, keeping the work. -->
    <button type="button" id="btn-close-embed" hidden
            style="font-size:18px;line-height:1;padding:3px 10px"
            title="Close the PDF Editor and go back to the generator (your work is kept)" aria-label="Close">&times;</button>
  </header>

  <div class="toolbar">
    <div class="grp">
      <button type="button" id="btn-open" onclick="document.getElementById('file-input').click()">Open PDF…</button>
      <button type="button" id="btn-reset">Close</button>
    </div>
    <div class="divider"></div>
    <div class="grp">
      <button type="button" id="btn-zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="btn-zoom-in">+</button>
      <button type="button" id="btn-zoom-fit">Reset</button>
    </div>
    <div class="divider"></div>
    <button type="button" id="btn-export" class="primary" disabled>Export PDF</button>
    <div id="hint"></div>
  </div>

  <main>
    <div id="drop-wrap">
      <div id="drop-zone">
        <h2>Drop a PDF</h2>
      </div>
    </div>

    <div id="viewer">
      <div id="pages"></div>
    </div>
  </main>

</div>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

<div id="overlay">
  <div class="progress-card">
    <div class="spinner"></div>
    <h4>Working…</h4>
    <div id="progress-note"></div>
    <div class="track"><div id="bar"></div></div>
  </div>
</div>

<!-- Vendored libraries, shared with the main app. No CDN for these. -->
<script src="../vendor/pdf.min.js"></script>
<script src="../vendor/pdf-lib.min.js"></script>

<!-- Load order matters:
     templates  — no dependencies, pure knowledge of the INF181 page catalogue
     TextModel  — needs templates (geometry, typography)
     PdfLoader  — needs templates + TextModel (measures word boxes)
     Exporter   — needs templates + TextModel (shares the layout engine)
     EditorUI   — needs everything                                          -->
<script src="js/templates.js"></script>
<script src="js/TextModel.js"></script>
<script src="js/PdfLoader.js"></script>
<script src="js/Exporter.js"></script>
<script src="js/EditorUI.js"></script>
<script>
  if (window.parent !== window) {
    var closeBtn = document.getElementById('btn-close-embed');
    closeBtn.hidden = false;
    closeBtn.addEventListener('click', function () {
      window.parent.postMessage({ type: 'ILoveINF181:close' }, '*');
    });
  }
</script>

</body>
</html>
